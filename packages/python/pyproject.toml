[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rootprint"
version = "0.1.0"
description = "Deterministic JSON Merkle hashing with custom hash providers"
readme = "README.md"
license = "EPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["rfc8785==0.1.4"]

[project.scripts]
rootprint = "rootprint.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
