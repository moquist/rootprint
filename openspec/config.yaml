schema: spec-driven
context: |
  All project implementation, tests, and maintenance are AI-authored. Humans
  supply requirements and account authorization; human code edits and routine
  human PR review must not be required. OpenSpec governs behavioral changes.
  Initial ports are TypeScript and Python; Rust follows successful shared
  conformance in a separate change. Support Linux, macOS, and Windows.
  JSON hashing uses RFC 8785 binary64 semantics and ordered arrays. UTC
  calculation labels are metadata, never part of deterministic Merkle identity.
  Work locally until the owner pushes to GitHub. Track work in docs/local-work.md;
  never claim remote automation, review gates, or publishing are active without
  verification. Preserve their requirements and report activation blockers.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
